[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optipixel"
version = "0.1.0"
description = "Web Image Optimizer & Converter desktop application powered by ImageMagick and PySide6"
readme = "README.md"
authors = [
    { name = "Ahaninja", email = "info@ahaninja.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "PySide6>=6.7.0",
    "Pillow>=10.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.5.0",
    "black>=24.3.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://ahaninja.com"
Repository = "https://github.com/ahaninja/OptiPixel"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py312']
