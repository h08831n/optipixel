name: OptiPixel Multi-Platform Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: OptiPixel-Windows-x64
            path_sep: ";"
          - os: macos-latest
            asset_name: OptiPixel-macOS-arm64
            path_sep: ":"
          - os: ubuntu-22.04
            asset_name: OptiPixel-Linux-x86_64
            path_sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libxcb-cursor0 libxcb-xinerama0 libegl1-mesa

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install imagemagick

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install imagemagick.app -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --name="OptiPixel" \
            --windowed \
            --noconfirm \
            --clean \
            --add-data="app/i18n${{ matrix.path_sep }}app/i18n" \
            --add-data="assets${{ matrix.path_sep }}assets" \
            --add-data="VERSION${{ matrix.path_sep }}." \
            app/main.py

      - name: Compress Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/OptiPixel/* -DestinationPath ${{ matrix.asset_name }}.zip
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/OptiPixel.iss
          Move-Item -Path Output/OptiPixel-Setup-*.exe -Destination . -Force

      - name: Compress Release Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist && tar -czvf ../${{ matrix.asset_name }}.tar.gz OptiPixel/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


