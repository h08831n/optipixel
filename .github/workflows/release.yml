name: OptiPixel Multi-Platform Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: OptiPixel-Windows-x64
            path_sep: ";"
          - os: macos-latest
            asset_name: OptiPixel-macOS-arm64
            path_sep: ":"
          - os: ubuntu-22.04
            asset_name: OptiPixel-Linux-x86_64
            path_sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libxcb-cursor0 libxcb-xinerama0 libegl1-mesa

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install imagemagick

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install imagemagick.app -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate Compatible Application Icons
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw

          os.makedirs('assets/icons', exist_ok=True)
          ico_path = 'assets/icons/app_icon.ico'

          candidates = [
              'assets/icons/app_icon_256.png',
              'assets/icons/app_icon.png',
              'assets/icons/icon_256.png',
              'assets/logo.png',
          ]

          img = None
          for path in candidates:
              if os.path.exists(path):
                  try:
                      with Image.open(path) as test_img:
                          test_img.verify()
                      loaded = Image.open(path).convert('RGBA')
                      img = loaded
                      print(f'Successfully loaded icon from {path}')
                      break
                  except Exception as e:
                      print(f'Skipping {path} (invalid or LFS pointer): {e}')

          if img is None:
              print('Generating fallback vector/bitmap icon...')
              img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([16, 16, 240, 240], radius=48, fill=(41, 128, 185, 255))
              draw.rectangle([64, 64, 116, 116], fill=(255, 255, 255, 240))
              draw.rectangle([140, 64, 192, 116], fill=(255, 255, 255, 240))
              draw.rectangle([64, 140, 116, 192], fill=(255, 255, 255, 240))
              draw.rectangle([140, 140, 192, 192], fill=(52, 152, 219, 255))

          img.save(ico_path, format='ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128)])
          print('Successfully generated app_icon.ico')
          "

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --name="OptiPixel" \
            --windowed \
            --noconfirm \
            --clean \
            --icon="assets/icons/app_icon.ico" \
            --add-data="app/i18n${{ matrix.path_sep }}app/i18n" \
            --add-data="assets${{ matrix.path_sep }}assets" \
            --add-data="VERSION${{ matrix.path_sep }}." \
            app/main.py

      - name: Build Installer & Archive (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ver = (Get-Content VERSION).Trim()
          Compress-Archive -Path dist/OptiPixel/* -DestinationPath ${{ matrix.asset_name }}-Portable.zip
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer/OptiPixel.iss
          Get-ChildItem Output/*.exe | Copy-Item -Destination .

      - name: Compress Release Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist && tar -czvf ../${{ matrix.asset_name }}.tar.gz OptiPixel/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}*
            OptiPixel-Setup-*.exe
            ${{ matrix.asset_name }}-Portable.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


