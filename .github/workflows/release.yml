name: OptiPixel Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ImageMagick
        run: |
          choco install imagemagick.app --version 7.1.1.29 -y
          magick --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: |
          pytest

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --name="OptiPixel" --windowed --noconfirm --clean --icon="assets/icons/app_icon.ico" --add-data="app/i18n;app/i18n" --add-data="assets;assets" --add-data="VERSION;." app/main.py

      - name: Build Installer with Inno Setup
        uses: MinCiencia/action-innosetup@v1
        with:
          path: installer/OptiPixel.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Output/OptiPixel-Setup-*.exe
            dist/OptiPixel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
